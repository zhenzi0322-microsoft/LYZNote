name: build-and-package

on:
  push:
    tags: ['mac*']   # 与你现有的 tag 发布策略保持一致

permissions:
  contents: write

env:
  APP_VERSION: '1.4.1.0'

jobs:
  # ============ Job：macOS Nuitka 编译并打包 zip（与 Windows 并行）============
  build-macos:
    runs-on: macos-latest   # Apple Silicon (arm64)；如需 Intel 版本改为 macos-13
    steps:
      - uses: actions/checkout@v6

      - name: Clone Codeup private repo
        run: |
          git clone https://oauth2:${{ secrets.CODEUP_TOKEN }}@codeup.aliyun.com/zheniz0322/Python/GUI/PySide6/LYZNote.git demo
          ls ./

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      # macOS 无需 MSVC，clang 由 runner 自带的 Xcode Command Line Tools 提供
      - name: Install build dependencies
        working-directory: demo
        run: pip install -r requirements.txt -i https://pypi.org/simple

      # 缓存 Nuitka 下载的依赖（clang 等），macOS 缓存路径为 ~/Library/Caches/Nuitka
      - name: Cache Nuitka downloads
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/Nuitka
          key: nuitka-${{ runner.os }}-${{ hashFiles('demo/requirements.txt') }}
          restore-keys: |
            nuitka-${{ runner.os }}-

      # macOS 专属参数：--macos-create-app-bundle 生成 .app bundle（Nuitka 自动 ad-hoc 签名）
      # 不能使用 --windows-console-mode / --windows-icon-from-ico 等 Windows 专属参数
      # --macos-app-icon 支持 .ico 自动转换；--macos-app-name 写入 Info.plist
      - name: Build protected app with Nuitka
        working-directory: demo
        run: python -m nuitka --assume-yes-for-downloads --noinclude-qt-translations --show-progress --macos-app-mode=gui --macos-app-name="LYZNote" --macos-app-icon=static/logo/logo.icns --macos-app-version="${{ env.APP_VERSION }}" --include-data-dir=templates=templates --include-data-dir=static/assets=static/assets --include-data-files=static/assets/libsimple.dylib=static/assets/libsimple.dylib --nofollow-import-to=unittest,tkinter --plugin-enable=pyside6 --include-package-data=aliyunsdkcore --include-package=markdown,markdown_checklist,pymdownx,mdx_math,pygments,mistune --output-dir=outputs main.py

      - name: print outputs
        working-directory: demo
        run: ls -l outputs
      
      # 必须 ditto 打包：保留 .app 内符号链接与可执行权限，普通 zip 会破坏权限导致“应用已损坏”
      - name: Package app bundle to zip
        working-directory: demo
        run: |
          APP_PATH=$(ls -d outputs/*.app 2>/dev/null | head -n1)
          if [ -z "$APP_PATH" ]; then echo "::error::未找到 .app bundle，请检查 Nuitka 构建"; exit 1; fi
          echo "App bundle: $APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "outputs/LYZNote-${{ env.APP_VERSION }}-macOS.zip"

      - name: Upload macOS zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: LYZNote-${{ env.APP_VERSION }}-macOS
          path: demo/outputs/LYZNote-*-macOS.zip
          retention-days: 14   # 最终产物保留 14 天，可直接从 Actions 页面下载分发
