name: build-macos-package

on:
  workflow_dispatch:
  push:
    tags: ['mac*']   # 与你现有的 tag 发布策略保持一致

permissions:
  contents: write

env:
  APP_VERSION: '1.4.2.0'
  MAC_ARCH: "x86_64"

jobs:
  # ============ Job：macOS Nuitka 编译并打包 zip（与 Windows 并行）============
  build-macos:
    runs-on: macos-latest   # Apple Silicon (arm64)；如需 Intel 版本改为 macos-13
    steps:
      - uses: actions/checkout@v6

      - name: Clone Codeup private repo
        run: |
          git clone https://oauth2:${{ secrets.CODEUP_TOKEN }}@codeup.aliyun.com/zheniz0322/Python/GUI/PySide6/LYZNote.git demo
          ls ./

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      # 缓存 Nuitka 下载的依赖（clang 等），macOS 缓存路径为 ~/Library/Caches/Nuitka
      - name: Cache Nuitka downloads
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/Nuitka
          key: nuitka-${{ runner.os }}-${{ hashFiles('demo/requirements.txt') }}
          restore-keys: |
            nuitka-${{ runner.os }}-

      - name: Build protected app with Nuitka
        working-directory: demo
        run: |
          chmod +x ./docs/scripts/build_nuitka_mac.sh
          ./docs/scripts/build_nuitka_mac.sh
        env:
          APP_VERSION: ${{ env.APP_VERSION }}
          MAC_ARCH: ${{ env.MAC_ARCH }}
      
      - name: Upload macOS zip artifact
        uses: actions/upload-artifact@v6
        with:
          name: LYZNote-${{ env.APP_VERSION }}-macOS
          path: demo/outputs/LYZNote-${{ env.APP_VERSION }}_${{ env.MAC_ARCH }}.dmg
          retention-days: 7
