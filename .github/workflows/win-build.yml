name: build-win-package
on:
  workflow_dispatch:
  push:
    tags: ['win*']

env:
  APP_VERSION: '1.4.1.0'

jobs:
  # ========= Job1：只做Nuitka编译，产出main.dist =========
  build-compile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Clone Codeup private repo into demo
        run: |
          git clone https://oauth2:${{ secrets.CODEUP_TOKEN }}@codeup.aliyun.com/zheniz0322/Python/GUI/PySide6/LYZNote.git demo
        shell: pwsh

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install Windows VC++ build tools
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache Nuitka downloads
        uses: actions/cache@v5
        with:
          path: ~\AppData\Local\Nuitka
          key: nuitka-${{ runner.os }}-${{ hashFiles('demo/requirements.txt') }}
          restore-keys: |
            nuitka-${{ runner.os }}-

      - name: Nuitka build windows
        working-directory: demo
        run: |
          ./docs/scripts/build_nuitka_win.ps1
        shell: pwsh

      # 上传编译产物（main.dist整个目录）给下一个job
      - name: Upload compile artifact
        uses: actions/upload-artifact@v6
        with:
          name: compile-output
          path: demo/outputs/
          retention-days: 7

  # ========= Job2：只做NSIS打包，不跑Nuitka编译 =========
  build-nsis:
    needs: build-compile   # 必须等编译job完成才执行
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      # 再次拉取源码（需要nsi脚本、static图标资源）
      - name: Clone Codeup private repo into demo
        run: |
          git clone https://oauth2:${{ secrets.CODEUP_TOKEN }}@codeup.aliyun.com/zheniz0322/Python/GUI/PySide6/LYZNote.git demo
        shell: pwsh

      # 下载上一步Nuitka编译好的 outputs 产物
      - name: Download compile artifact
        uses: actions/download-artifact@v6
        with:
          name: compile-output
          path: demo/outputs

      - name: Install NSIS via Chocolatey
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # ⚠️注意：working‑directory: demo，$root = demo目录，所有资源都在demo下
      - name: Build NSIS Installer
        shell: pwsh
        working-directory: demo
        run: |
          $root = $pwd.Path
          Write-Host "ROOT = $root"
          Write-Host "Ico exists: $(Test-Path "$root\static\logo\logo.ico")"
          Write-Host "main.dist exists: $(Test-Path "$root\outputs\main.dist")"
          makensis "/DAPP_VERSION=${{ env.APP_VERSION }}" "/DROOT=$root" ./docs/scripts/installer.nsi

      - name: print outputs
        working-directory: demo
        run: |
          Get-ChildItem ./outputs

      - name: Upload final setup artifact
        uses: actions/upload-artifact@v6
        with:
          name: LYZNote-${{ env.APP_VERSION }}-windows
          path: demo/outputs/LYZNote-*-win-setup.exe
          retention-days: 7
