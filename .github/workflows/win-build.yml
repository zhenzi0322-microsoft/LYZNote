name: build-win-package

on:
  workflow_dispatch:
  push:
    tags: ['win*']   # 与你现有的 tag 发布策略保持一致

env:
  APP_VERSION: '1.4.1.0'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Clone Codeup private repo
        run: |
          git clone https://oauth2:${{ secrets.CODEUP_TOKEN }}@codeup.aliyun.com/zheniz0322/Python/GUI/PySide6/LYZNote.git demo
          ls ./

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      # Windows VC 编译工具
      - name: Install Windows VC++ build tools
        uses: ilammy/msvc-dev-cmd@v1

      # 缓存 Nuitka 下载的 gcc（winlibs）及编译缓存，避免每次重新下载数百 MB
      - name: Cache Nuitka downloads
        uses: actions/cache@v5
        with:
          path: ~\AppData\Local\Nuitka
          key: nuitka-${{ runner.os }}-${{ hashFiles('demo/requirements.txt') }}
          restore-keys: |
            nuitka-${{ runner.os }}-

      - name: Nuitka build windows
        working-directory: demo
        run: |
          ./docs/scripts/build_nuitka_win.ps1
        shell: pwsh
        env:
          APP_VERSION: ${{ env.APP_VERSION }}

      - name: Build NSIS Installer
        working-directory: demo
        run: |
          makensis /DAPP_VERSION=${{ env.APP_VERSION }} docs/scripts/installer.nsi
      
      - name: print outputs
        working-directory: demo
        run: |
          ls -l ./outputs

      # 将编译产物传给下一个 job；MSIX 环节失败时重跑 package job 即可，无需重新编译
      - name: Upload Nuitka dist artifact
        uses: actions/upload-artifact@v6
        with:
          name: LYZNote-${{ env.APP_VERSION }}-windows
          path: demo/outputs/LYZNote-*-win.exe
          retention-days: 7   # 中间产物只保留 3 天，节省存储配额
