name: GetBaseMetadata 
 
on: 
  workflow_dispatch: 
 
jobs: 
  build: 
    runs-on: windows-latest 
 
    steps: 
    - uses: actions/checkout@v5
 
    - uses: microsoft/microsoft-store-apppublisher@v1.1 

    - name: msstore reconfigure help
      run: msstore reconfigure --help

    # 诊断：直接用凭据向 AAD 申请 Store API token，失败时输出精确的 AAD 错误码
    - name: Diagnose Store API credentials
      shell: pwsh
      run: |
        $tenantId = '${{ secrets.AZURE_AD_TENANT_ID }}'.Trim()
        Write-Host "tenantId 长度: $($tenantId.Length)（GUID 应为 36）"
        try {
          $body = @{
            grant_type    = 'client_credentials'
            client_id     = '${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}'.Trim()
            client_secret = '${{ secrets.AZURE_AD_APPLICATION_SECRET }}'.Trim()
            resource      = 'https://manage.devcenter.microsoft.com'
          }
          Invoke-RestMethod -Method Post -Uri "https://login.microsoftonline.com/$tenantId/oauth2/token" -Body $body | Out-Null
          Write-Host "✅ 凭据有效：clientId/clientSecret/tenantId 均正确"
          Write-Host "若 msstore 仍报 auth 失败，问题在 Partner Center 关联：应用未关联账户或未授予 Manager 角色；另确认 sellerId 填的是 TenantId"
        } catch {
          $detail = if ($_.ErrorDetails.Message) { $_.ErrorDetails.Message } else {
            $reader = [System.IO.StreamReader]::new($_.Exception.Response.GetResponseStream())
            $reader.ReadToEnd()
          }
          Write-Host "❌ AAD 认证失败，详情：$detail"
          Write-Host "对照错误码：AADSTS90002=tenantId错误 | AADSTS700016=clientId不存在于该租户 | AADSTS7000215=clientSecret错误或过期"
          throw "凭据诊断失败，见上方 AAD 错误详情"
        }

    - name: Configure MSStore CLI 
      run: msstore reconfigure --tenantId ${{ secrets.AZURE_AD_TENANT_ID }} --sellerId ${{ secrets.SELLER_ID }} --clientId ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }} --clientSecret ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
 
    - name: Get base metadata  
      shell: pwsh 
      run: | 
        # msstore CLI 报错信息太笼统，直接调 REST API 拿真实错误
        $tenantId = '${{ secrets.AZURE_AD_TENANT_ID }}'.Trim()
        $body = @{
          grant_type    = 'client_credentials'
          client_id     = '${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}'.Trim()
          client_secret = '${{ secrets.AZURE_AD_APPLICATION_SECRET }}'.Trim()
          resource      = 'https://manage.devcenter.microsoft.com'
        }
        $token = (Invoke-RestMethod -Method Post -Uri "https://login.microsoftonline.com/$tenantId/oauth2/token" -Body $body).access_token
        $headers = @{ Authorization = "Bearer $token" }

        Write-Host "--- 1) 账户下所有应用（对照你的 STORE_ID）---"
        try {
          $apps = Invoke-RestMethod -Uri "https://manage.devcenter.microsoft.com/v1.0/my/applications" -Headers $headers
          $apps.value | ForEach-Object { Write-Host "appId=$($_.id)  name=$($_.name)" }
        } catch {
          Write-Host "拉取应用列表失败：$($_.Exception.Response.StatusCode) $($_.ErrorDetails.Message)"
        }

        Write-Host "--- 2) 查询 STORE_ID 的 submission ---"
        $productId = '${{ secrets.STORE_ID }}'.Trim()
        Write-Host "STORE_ID 长度: $($productId.Length)"
        try {
          $sub = Invoke-RestMethod -Uri "https://manage.devcenter.microsoft.com/v1.0/my/applications/$productId/submissions" -Headers $headers
          $sub | ConvertTo-Json -Depth 5
        } catch {
          Write-Host "查询 submission 失败：$($_.Exception.Response.StatusCode) $($_.ErrorDetails.Message)"
          Write-Host "404=产品ID错误或应用不在账户内 | 403=应用注册未关联或无 Manager 角色"
          throw
        }