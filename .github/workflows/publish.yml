name: publish-to-store

on:
  push:
    tags: ['v*']   # 与你现有的 tag 发布策略保持一致

env:
  APP_VERSION: '1.4.1.0'
  PRODUCT_ID: ${{ secrets.STORE_PRODUCT_ID }}   # Partner Center → 应用 → 产品管理 → 产品ID

jobs:
  # ============ Job 1：Nuitka 编译（耗时最长，产物缓存为中间 artifact）============
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      # 前置校验：Store 打包所需的 secret 必须已配置，否则提前报明确错误
      - name: Validate Store secrets
        shell: pwsh
        run: |
          $missing = @()
          if (-not '${{ secrets.STORE_PACKAGE_IDENTITY_NAME }}') { $missing += 'STORE_PACKAGE_IDENTITY_NAME' }
          if (-not '${{ secrets.STORE_PUBLISHER }}')             { $missing += 'STORE_PUBLISHER' }
          if (-not '${{ secrets.STORE_PUBLISHER_DISPLAY_NAME }}') { $missing += 'STORE_PUBLISHER_DISPLAY_NAME' }
          if ($missing.Count -gt 0) {
            throw "缺少 GitHub Secret: $($missing -join ', ')。请到 Settings → Secrets and variables → Actions 配置（值取自 Partner Center → 包标识页面）"
          }

      - name: Clone Codeup private repo
        run: |
          git clone https://oauth2:${{ secrets.CODEUP_TOKEN }}@${{ secrets.GIT_URL }} demo
          ls ./

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # Windows VC 编译工具
      - name: Install Windows VC++ build tools
        uses: ilammy/msvc-dev-cmd@v1

      # Python 依赖（Nuitka 必须在 requirements.txt 中，否则在此追加）
      - name: Install build dependencies
        working-directory: demo
        run: pip install -r requirements.txt -i https://pypi.org/simple

      # 缓存 Nuitka 下载的 gcc（winlibs）及编译缓存，避免每次重新下载数百 MB
      - name: Cache Nuitka downloads
        uses: actions/cache@v5
        with:
          path: ~\AppData\Local\Nuitka
          key: nuitka-${{ runner.os }}-${{ hashFiles('demo/requirements.txt') }}
          restore-keys: |
            nuitka-${{ runner.os }}-

      # 执行自研构建脚本 --keep-tmp 异常时保留临时目录
      # --assume-yes-for-downloads：CI 非交互环境下自动确认下载官方指定的 winlibs gcc
      - name: Build protected executable with Nuitka
        working-directory: demo
        run: python -m nuitka --standalone --assume-yes-for-downloads --noinclude-qt-translations --windows-console-mode=disable --onefile-no-compression --show-progress --product-name="LYZNote" --file-version="${{ env.APP_VERSION }}" --nofollow-import-to=unittest,tkinter --plugin-enable=pyside6 --windows-icon-from-ico=static/logo.ico --output-dir=outputs --output-filename=LYZNote main.py
      # 将编译产物传给下一个 job；MSIX 环节失败时重跑 package job 即可，无需重新编译
      - name: Upload Nuitka dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuitka-dist
          path: demo/outputs/main.dist
          retention-days: 3   # 中间产物只保留 3 天，节省存储配额

  # ============ Job 2：MSIX 打包、签名并发布到 Microsoft Store ============
  package-and-publish:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      # 恢复 Job 1 的编译产物到 demo/outputs/main.dist
      # 注意：v4 上传单个目录时不保留父级路径，必须显式指定下载目录
      - name: Download Nuitka dist artifact
        uses: actions/download-artifact@v4
        with:
          name: nuitka-dist
          path: demo/outputs/main.dist

      # 生成 MSIX：清单 + MakeAppx 打包
      # 自 2023 年起 Partner Center 不再强制要求受信任证书签名，
      # 上传后微软平台会对包重新签名，因此 CI 内使用自签名证书即可。
      - name: Create MSIX package
        shell: pwsh
        working-directory: demo
        run: |
          New-Item -ItemType Directory -Force msix-root | Out-Null
          # standalone 模式输出的是 main.dist 目录，需 -Recurse 递归复制
          Copy-Item outputs/main.dist msix-root/main.dist -Recurse
          # 自动探测 main.dist 内的入口 exe（--output-filename=LYZNote 时为 LYZNote.exe，否则为 main.exe）
          $exe = Get-ChildItem msix-root/main.dist/*.exe | Select-Object -First 1
          if (-not $exe) { throw "No exe found in outputs/main.dist" }
          Write-Host "Entry executable: $($exe.Name)"

          # 校验并规范化 Store 身份信息（去除粘贴带入的首尾空白/换行）
          $identityName = '${{ secrets.STORE_PACKAGE_IDENTITY_NAME }}'.Trim()
          $publisher = '${{ secrets.STORE_PUBLISHER }}'.Trim()
          $publisherDisplay = '${{ secrets.STORE_PUBLISHER_DISPLAY_NAME }}'.Trim()
          if ($publisher -notmatch '^(CN|L|O|OU|E|C|S|STREET|T|G|I|SN|DC|SERIALNUMBER)=') {
            # 不输出值本身（会被掩码），只输出结构特征便于排查
            Write-Host "STORE_PUBLISHER 诊断：长度=$($publisher.Length), 含等号=$($publisher.Contains('=')), 以CN开头=$($publisher.StartsWith('CN'))"
            throw "STORE_PUBLISHER 格式错误：必须是 DN 格式如 'CN=XXXXXXXX'。完整值请到 Partner Center → 应用管理 → 包标识页面复制 Publisher 字段"
          }

          @"
          <?xml version="1.0" encoding="utf-8"?>
          <Package xmlns="http://schemas.microsoft.com/appx/manifest/foundation/windows10"
                   xmlns:uap="http://schemas.microsoft.com/appx/manifest/uap/windows10"
                   xmlns:uap3="http://schemas.microsoft.com/appx/manifest/uap/windows10/3"
                   xmlns:rescap="http://schemas.microsoft.com/appx/manifest/foundation/windows10/restrictedcapabilities">
            <Identity Name="$identityName"
                      Version="${{ env.APP_VERSION }}"
                      Publisher="$publisher"
                      ProcessorArchitecture="x64" />
            <Properties>
              <DisplayName>LYZNote</DisplayName>
              <PublisherDisplayName>$publisherDisplay</PublisherDisplayName>
              <Logo>Assets\StoreLogo.png</Logo>
            </Properties>
            <Resources>
              <Resource Language="zh-cn" />
            </Resources>
            <Dependencies>
              <TargetDeviceFamily Name="Windows.Desktop" MinVersion="10.0.17763.0" MaxVersionTested="10.0.22621.0" />
            </Dependencies>
            <Capabilities>
              <rescap:Capability Name="runFullTrust" />
            </Capabilities>
            <Applications>
              <Application Id="LYZNote" Executable="main.dist\$($exe.Name)" EntryPoint="Windows.FullTrustApplication">
                <uap:VisualElements DisplayName="LYZNote" Description="LYZNote"
                                    BackgroundColor="transparent" Square150x150Logo="Assets\Square150x150Logo.png"
                                    Square44x44Logo="Assets\Square44x44Logo.png">
                  <uap:DefaultTile Wide310x150Logo="Assets\Wide310x150Logo.png" />
                </uap:VisualElements>
              </Application>
            </Applications>
          </Package>
          "@ | Out-File -Encoding utf8BOM msix-root/AppxManifest.xml   # MakeAppx 要求声明 UTF-8 的清单带 BOM

          New-Item -ItemType Directory -Force msix-root/Assets | Out-Null
          Copy-Item ../.github/store-assets/*.png msix-root/Assets/

          $makeappx = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe" |
                      Sort-Object FullName | Select-Object -Last 1
          & $makeappx.FullName pack /d msix-root /p LYZNote.msix /o
          if ($LASTEXITCODE -ne 0) { throw "MakeAppx failed" }
          if (-not (Test-Path LYZNote.msix)) { throw "MakeAppx 未生成 LYZNote.msix，当前目录：$PWD" }

      - name: Sign MSIX (self-signed for CI)
        shell: pwsh
        working-directory: demo
        run: |
          $msix = Join-Path $PWD 'LYZNote.msix'
          if (-not (Test-Path $msix)) {
            Write-Host "当前目录内容："; Get-ChildItem | ForEach-Object { Write-Host $_.FullName }
            throw "找不到 $msix"
          }

          # 提交 Store 时平台会重新签名，自签名失败不应阻塞发布，降级为警告继续
          try {
            # CodeSigningCert 类型自带代码签名 EKU，比 Custom 拼扩展更不易触发签名栈兼容问题
            $cert = New-SelfSignedCertificate -Type CodeSigningCert `
                      -Subject "CN=LYZNote CI" `
                      -KeyUsage DigitalSignature `
                      -NotAfter (Get-Date).AddYears(2) `
                      -CertStoreLocation Cert:\CurrentUser\My
            $pfxPass = ConvertTo-SecureString -String "ci-signing-temp" -Force -AsPlainText
            $pfx = Join-Path $PWD 'LYZNote.pfx'
            Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $pfxPass | Out-Null

            $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
                        Sort-Object FullName | Select-Object -Last 1
            Write-Host "signtool: $($signtool.FullName)"
            Write-Host "signing : $msix"
            & $signtool.FullName sign /fd SHA256 /v /f $pfx /p "ci-signing-temp" /t "http://timestamp.digicert.com" $msix
            if ($LASTEXITCODE -ne 0) { throw "signtool 退出码 $LASTEXITCODE" }
            Write-Host "✅ MSIX 签名成功"
          } catch {
            Write-Warning "MSIX 签名失败（不影响 Store 提交，Partner Center 上传后会用微软证书重新签名）：$_"
          }

      # ------------------------------------------------------------------
      # 发布方式说明（方案 A）：
      # 本账户为个人 MSA 开发者账户，微软不支持其通过 client_credentials
      # 调用 Store Submission API（无「Entra 应用程序」关联入口），
      # 因此 CI 只负责构建 + 打包 MSIX，提交发布采用手动方式：
      #   1. 本工作流完成后，在 Actions 页面下载 artifact（LYZNote-x.x.x.x）
      #   2. 解压得到 LYZNote.msix
      #   3. Partner Center → 应用 → 提交 → 上传该 MSIX → 提交认证
      # 若日后升级为企业账户，可恢复下方 msstore 自动发布步骤。
      # ------------------------------------------------------------------
      # - name: Install Microsoft Store CLI
      #   run: dotnet tool install -g MicrosoftStoreServicesCLI
      # - name: Configure Microsoft Store CLI
      #   run: msstore reconfigure --tenantId ${{ secrets.TENANT_ID }} --sellerId ${{ secrets.TENANT_ID }} --clientId ${{ secrets.CLIENT_ID }} --clientSecret ${{ secrets.CLIENT_SECRET }}
      # - name: Publish to Microsoft Store
      #   run: msstore publish "${{ github.workspace }}/demo/LYZNote.msix" -id ${{ env.PRODUCT_ID }} --telemetry

      # 最终产物：MSIX + 完整 dist 目录
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LYZNote-${{ env.APP_VERSION }}
          retention-days: 14   # Free 计划 artifact 存储配额仅 500MB，避免多版本累积占满
          path: |
            demo/LYZNote.msix
            demo/outputs/main.dist
